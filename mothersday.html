<!DOCTYPE html>
<html>
<head>
    <title>Mother's Day Flowers</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color: #ffe6f0;
        }

        canvas {
            border: 2px solid black;
            background-color: white;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
        }

        select {
            padding: 10px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>🌸 Happy Mother's Day 🌸</h1>

    <p>Pick a flower!</p>

    <select id="flower">
        <option>Rose</option>
        <option>Tulip</option>
        <option>Daisy</option>
    </select>

    <button onclick="drawFlower()">
        Draw Flower
    </button>

    <br>

    <canvas id="canvas" width="500" height="500"></canvas>

    <script>

        function drawFlower() {

            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");

            const flower = document.getElementById("flower").value;

            // Clears canvas every time
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (flower === "Rose") {
                drawRose(ctx);
            }

            else if (flower === "Tulip") {
                drawTulip(ctx);
            }

            else if (flower === "Daisy") {
                drawDaisy(ctx);
            }
        }

        function drawRose(ctx) {

            // stem
            ctx.beginPath();
            ctx.moveTo(250, 400);
            ctx.lineTo(250, 250);
            ctx.strokeStyle = "green";
            ctx.lineWidth = 8;
            ctx.stroke();

            // flower
            ctx.fillStyle = "red";

            for (let i = 0; i < 8; i++) {

                ctx.beginPath();

                let angle = i * (Math.PI / 4);

                let x = 250 + Math.cos(angle) * 40;
                let y = 200 + Math.sin(angle) * 40;

                ctx.arc(x, y, 30, 0, Math.PI * 2);

                ctx.fill();
            }

            // center
            ctx.beginPath();
            ctx.fillStyle = "darkred";
            ctx.arc(250, 200, 30, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawTulip(ctx) {

            // stem
            ctx.beginPath();
            ctx.moveTo(250, 400);
            ctx.lineTo(250, 250);
            ctx.strokeStyle = "green";
            ctx.lineWidth = 8;
            ctx.stroke();

            // flower
            ctx.fillStyle = "pink";

            ctx.beginPath();
            ctx.moveTo(220, 250);
            ctx.lineTo(250, 180);
            ctx.lineTo(280, 250);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(200, 250);
            ctx.lineTo(230, 190);
            ctx.lineTo(250, 250);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(250, 250);
            ctx.lineTo(270, 190);
            ctx.lineTo(300, 250);
            ctx.fill();
        }

        function drawDaisy(ctx) {

            // stem
            ctx.beginPath();
            ctx.moveTo(250, 400);
            ctx.lineTo(250, 250);
            ctx.strokeStyle = "green";
            ctx.lineWidth = 8;
            ctx.stroke();

            // petals
            ctx.fillStyle = "white";

            for (let i = 0; i < 12; i++) {

                let angle = i * (Math.PI / 6);

                let x = 250 + Math.cos(angle) * 50;
                let y = 200 + Math.sin(angle) * 50;

                ctx.beginPath();
                ctx.arc(x, y, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            // center
            ctx.beginPath();
            ctx.fillStyle = "yellow";
            ctx.arc(250, 200, 30, 0, Math.PI * 2);
            ctx.fill();
        }

    </script>

</body>
</html>
