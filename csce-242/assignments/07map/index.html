<!DOCTYPE html>
<html>
    <head>
        <title>Assignment 10</title>
        <link rel="stylesheet" href="styles.css">
        <meta charset="UTF-8">
    </head>

    <body>
        <div id="content">
            <header>
                <h1>Assignment 10</h1>
                <h2>Arrays</h2>
            </header>

            <main>
                <!-- This section lets the user choose a destination type -->
                <section id="destination-section">
                    <label for="destination-type">
                        Pick Your Destination Type
                    </label>

                    <select id="destination-type">
                        <option value="">Select</option>
                        <option value="stores">Skate Stores</option>
                        <option value="spots">Skate Spots</option>
                    </select>

                    <!-- JavaScript puts the destination links here -->
                    <div id="destination-links"></div>

                    <!-- The map is hidden until a destination is selected -->
                    <iframe
                        id="map"
                        class="hidden"
                        title="Destination Map">
                    </iframe>
                </section>
            </main>

            <footer>
                <p>@ianrepik</p>
            </footer>
        </div>
        <script src="java.js"></script>
    </body>
</html>
