<!DOCTYPE html>
<html>
    <head>
        <title>Assignment 11</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet"
            href="https://www.w3schools.com/w3css/4/w3.css">
        <meta charset="UTF-8">
    </head>

    <body>
        <div id="content">
            <header>
                <h1>Vacations</h1>
                <h2>Vacation Experiences</h2>
            </header>

            <!-- JavaScript puts all vacation cards here -->
            <main id="vacation-list"></main>

            <footer>
                <p>@ianrepik</p>
            </footer>
        </div>

        <!-- Hidden modal popup -->
        <div id="vacation-modal" class="w3-modal">
            <div class="w3-modal-content w3-animate-zoom">
                <span id="close-modal" class="w3-button close-button">
                    &times;
                </span>

                <section id="modal-content">
                    <iframe id="modal-map"
                        title="Vacation Map">
                    </iframe>

                    <div id="modal-info">
                        <h2 id="modal-title"></h2>

                        <p>
                            <strong>Type:</strong>
                            <span id="modal-type"></span>
                        </p>

                        <p>
                            <strong>Description:</strong>
                            <span id="modal-description"></span>
                        </p>

                        <p>
                            <strong>Things To Do:</strong>
                            <span id="modal-things"></span>
                        </p>
                    </div>
                </section>
            </div>
        </div>

        <script src="index.js"></script>
    </body>
</html>
